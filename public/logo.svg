<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="260" height="70" fill="none">
  <defs>
    <!-- Radiant Golden Sun & Flame Gradient -->
    <linearGradient id="sunGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F1C"/>
      <stop offset="50%" stop-color="#E86014"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: Sun Symbol with S-shaped Divine Ray -->
  <g transform="translate(6, 6)">
    <!-- Sun Rays radiating outward -->
    <g transform="translate(28, 28)">
      <!-- 12 Flame Rays -->
      <path d="M0 -25 L3 -16 L-3 -16 Z" fill="url(#sunGoldGrad)" />
      <path d="M0 25 L3 16 L-3 16 Z" fill="url(#sunGoldGrad)" />
      <path d="M-25 0 L-16 3 L-16 -3 Z" fill="url(#sunGoldGrad)" />
      <path d="M25 0 L16 3 L16 -3 Z" fill="url(#sunGoldGrad)" />
      <path d="M-17.7 -17.7 L-9.5 -14.5 L-14.5 -9.5 Z" fill="url(#sunGoldGrad)" />
      <path d="M17.7 17.7 L9.5 14.5 L14.5 9.5 Z" fill="url(#sunGoldGrad)" />
      <path d="M17.7 -17.7 L14.5 -9.5 L9.5 -14.5 Z" fill="url(#sunGoldGrad)" />
      <path d="M-17.7 17.7 L-14.5 9.5 L-9.5 14.5 Z" fill="url(#sunGoldGrad)" />

      <!-- Center Divine Swirl 'S' Symbol -->
      <circle cx="0" cy="0" r="14" fill="#FFFDF8" stroke="#E86014" stroke-width="1.5" />
      <!-- S Swirl Wave -->
      <path d="M-5 -7 C-2 -11, 6 -10, 6 -5 C6 0, -6 3, -6 8 C-6 13, 2 14, 5 11" fill="none" stroke="url(#sunGoldGrad)" stroke-width="3" stroke-linecap="round" />
      <!-- Radiant Bindu Dot -->
      <circle cx="2" cy="-4" r="1.5" fill="#E86014" />
    </g>
  </g>

  <!-- Right: Logo Text Matching Reference Exactly -->
  <g transform="translate(68, 14)">
    <!-- Top Word: SURYAPRAKASH / SURYAPAKASH in Golden Amber -->
    <text x="0" y="22" font-family="'Cinzel', 'Playfair Display', serif" font-size="16.5" font-weight="800" letter-spacing="1.5" fill="#E86014">
      SURYAPRAKASH
    </text>

    <!-- Bottom Word: — PUROHIT — -->
    <g transform="translate(0, 36)">
      <!-- Left line -->
      <line x1="12" y1="-4" x2="38" y2="-4" stroke="#D4AF37" stroke-width="1.2" />
      <!-- PUROHIT text -->
      <text x="46" y="0" font-family="'Cinzel', 'Playfair Display', serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="#D4AF37">
        PUROHIT
      </text>
      <!-- Right line -->
      <line x1="120" y1="-4" x2="146" y2="-4" stroke="#D4AF37" stroke-width="1.2" />
    </g>
  </g>
</svg>
